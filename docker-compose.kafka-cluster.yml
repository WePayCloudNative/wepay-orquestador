# ============================================================
# Clúster Kafka: 1 Zookeeper + 3 brokers (requisito: Kafka con Zookeeper y brokers)
# En AWS corre en la EC2 "ec2-microservicios".
#
# Uso:   docker compose -f docker-compose.kafka-cluster.yml up -d
# Luego: ./kafka/crear-topicos.sh   (crea los tópicos con 3 réplicas)
#
# Cada mensaje se guarda en los 3 brokers y se confirma cuando está en al menos 2
# (min.insync.replicas=2): el clúster sigue funcionando si cae un broker.
# Kafka solo escucha dentro de la red Docker (sin puertos publicados).
# ============================================================

x-broker: &broker
  image: confluentinc/cp-kafka:7.9.11
  restart: unless-stopped
  mem_limit: 768m
  depends_on: [zookeeper]
  networks: [wepay-net]

x-broker-env: &broker-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.11
    container_name: zookeeper
    restart: unless-stopped
    mem_limit: 512m
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-log:/var/lib/zookeeper/log
    networks: [wepay-net]

  kafka:
    <<: *broker
    container_name: kafka
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *broker
    container_name: kafka2
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *broker
    container_name: kafka3
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092
    volumes:
      - kafka3-data:/var/lib/kafka/data

volumes:
  zk-data:
  zk-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:

networks:
  wepay-net:
    name: wepay-net
