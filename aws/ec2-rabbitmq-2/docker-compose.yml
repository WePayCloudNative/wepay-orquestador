# ============================================================
# RabbitMQ 2 - "broker de respaldo y auditoría" (EC2 ec2-rabbitmq-2)
# Copiar a ~/rabbitmq2/ junto con enabled_plugins, setup-rabbit2.sh y .env
#   docker compose up -d
#   set -a; . ./.env; set +a; RABBIT1_HOST=172.31.22.184 ./setup-rabbit2.sh
# No publica el 5672: nadie se conecta a este broker, es él quien lee del Rabbit 1.
# ============================================================
services:
  rabbitmq2:
    image: rabbitmq:3.13-management
    container_name: rabbitmq2
    hostname: rabbitmq2
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "15672:15672"   # panel web (restringido a tu IP en sg-rabbitmq2)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    volumes:
      - rabbit2_data:/var/lib/rabbitmq
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  rabbit2_data:
